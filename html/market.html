<style>
  :root {

    --card: #ffffff;
    --ink: #1c1c1e;
    --sub: #8a8f99;
    --yellow: #ffe60f;      /* 闲鱼标志性黄 */
    --yellow-d: #f5c400;
    --red: #ff4f3a;         /* 价格红 */
    --line: #eceef1;
    --blue: #2b7cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI", Roboto, sans-serif;
    padding-bottom: 64px;   /* 底部导航留位 */
  }
  .app { max-width: 560px; margin: 0 auto; }

  /* 顶栏 */
  header {
    position: sticky; top: 0; z-index: 30;
    background: linear-gradient(180deg, var(--yellow) 0%, var(--yellow-d) 100%);
    padding: 10px 12px 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }
  .brand {
    display: flex; align-items: baseline; gap: 8px;
    font-weight: 900; font-size: 20px; color: #1a1a1a;
  }
  .brand .tag { font-size: 12px; font-weight: 600; color: #6b5a00; }
  .searchbar {
    display: flex; align-items: center; gap: 8px;
    margin-top: 10px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 999px; padding: 9px 14px;
    color: var(--sub); font-size: 14px;
  }
  .searchbar input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 14px; color: var(--ink); font-family: inherit;
  }
  .toprow { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .langpick {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: #4a3f00; font-weight: 700;
  }
  .langpick select {
    border: 1px solid rgba(0, 0, 0, 0.15); background: rgba(255,255,255,0.85);
    border-radius: 8px; padding: 4px 6px; font-size: 12px; font-family: inherit; color: #1a1a1a;
  }

  /* 分类条 */
  .cats {
    display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px;
    -webkit-overflow-scrolling: touch;
  }
  .cats::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 6px 14px; border-radius: 999px;
    background: var(--card); color: var(--sub); font-size: 13px; font-weight: 600;
    border: 1px solid var(--line); cursor: pointer; white-space: nowrap;
  }
  .chip.on { background: #1a1a1a; color: var(--yellow); border-color: #1a1a1a; }

  /* 商品瀑布（两列网格）*/
  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px 12px;
  }
  .card {
    background: var(--card); border-radius: 12px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06); cursor: pointer;
    display: flex; flex-direction: column;
  }
  .thumb {
    height: 132px; display: flex; align-items: center; justify-content: center;
    font-size: 62px; position: relative;
  }
  .thumb .cond {
    position: absolute; left: 8px; bottom: 8px;
    background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 11px;
    padding: 2px 7px; border-radius: 6px;
  }
  .thumb .flag {
    position: absolute; right: 8px; top: 8px;
    background: rgba(255, 255, 255, 0.9); font-size: 15px; padding: 2px 5px; border-radius: 6px;
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
  }
  .body { padding: 9px 10px 11px; }
  .ttl {
    font-size: 14px; line-height: 1.35; font-weight: 600; color: var(--ink);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 38px;
  }
  .price { margin-top: 6px; color: var(--red); font-weight: 900; font-size: 18px; }
  .price small { font-size: 12px; font-weight: 700; }
  .meta { margin-top: 6px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--sub); }
  .seller { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .seller .av { font-size: 15px; }
  .seller .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .want { flex: 0 0 auto; }

  /* 翻译按钮 / 标记 */
  .trans {
    margin-top: 8px; display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--blue); color: var(--blue); background: #eef4ff;
    border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  .trans:active { transform: scale(0.96); }
  .trans.done { background: var(--blue); color: #fff; }
  .trans.locked { border-color: var(--line); color: var(--sub); background: #f2f3f5; cursor: default; }
  .tnote { margin-top: 5px; font-size: 11px; color: #9aa0aa; }
  .tnote b { color: var(--blue); font-weight: 700; }

  /* 详情弹层 */
  .mask {
    position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.5);
    display: none; align-items: flex-end; justify-content: center;
  }
  .mask.show { display: flex; }
  .sheet {
    width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
    background: var(--card); border-radius: 16px 16px 0 0;
    animation: up 0.28s ease-out;
  }
  @keyframes up { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
  .sheet .hero {
    height: 210px; display: flex; align-items: center; justify-content: center; font-size: 104px; position: relative;
  }
  .sheet .x {
    position: absolute; right: 12px; top: 12px; width: 32px; height: 32px; border-radius: 50%;
    background: rgba(0, 0, 0, 0.4); color: #fff; border: none; font-size: 18px; cursor: pointer;
  }
  .sheet .pad { padding: 14px 16px 22px; }
  .dprice { color: var(--red); font-size: 26px; font-weight: 900; }
  .dprice small { font-size: 14px; }
  .dtitle { margin-top: 6px; font-size: 17px; font-weight: 700; line-height: 1.4; }
  .dtags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .dtags span { font-size: 12px; color: #6b5a00; background: #fff6cc; border-radius: 6px; padding: 2px 8px; }
  .ddesc { margin-top: 12px; font-size: 15px; line-height: 1.6; color: #333; white-space: pre-wrap; }
  .dsec { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .dsec h4 { margin: 0 0 8px; font-size: 13px; color: var(--sub); font-weight: 700; }
  .sellerbox { display: flex; align-items: center; gap: 10px; }
  .sellerbox .bigav {
    width: 44px; height: 44px; border-radius: 50%; background: #f0f0f0;
    display: flex; align-items: center; justify-content: center; font-size: 24px;
  }
  .sellerbox .info { font-size: 14px; }
  .sellerbox .info .s2 { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn {
    flex: 1; border: none; border-radius: 999px; padding: 13px; font-size: 16px; font-weight: 800;
    cursor: pointer; font-family: inherit;
  }
  .btn.chat { background: #f2f3f5; color: #333; }
  .btn.buy { background: linear-gradient(90deg, var(--yellow), var(--yellow-d)); color: #1a1a1a; }
  .btn:active { transform: scale(0.98); }

  /* 底部导航 */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    max-width: 560px; margin: 0 auto;
    display: flex; background: var(--card); border-top: 1px solid var(--line);
  }
  nav .it {
    flex: 1; text-align: center; padding: 7px 0 8px; font-size: 11px; color: var(--sub);
  }
  nav .it .ic { font-size: 20px; display: block; }
  nav .it.on { color: #1a1a1a; font-weight: 700; }
  nav .it.pub .ic {
    display: inline-flex; width: 40px; height: 28px; border-radius: 8px;
    background: var(--yellow); align-items: center; justify-content: center; font-size: 18px; margin-top: -6px;

  /* 下单提示 toast */
  .toast {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 80; background: rgba(0, 0, 0, 0.86); color: #fff;
    padding: 18px 22px; border-radius: 14px; font-size: 15px; max-width: 78%;
    text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .toast.show { opacity: 1; }
  .toast .big { font-size: 40px; display: block; margin-bottom: 6px; }

];

/* ================= 设备语言识别 =================
 * 优先级：URL ?lang= （游戏可注入玩家设备语言）> navigator.language > en */
function detectLang() {
  var q = "";
  try { q = (new URLSearchParams(location.search).get("lang") || "").toLowerCase(); } catch (e) {}
  var pick = function (code) {
    code = (code || "").toLowerCase();
    for (var i = 0; i < LANGS.length; i++) { if (code === LANGS[i] || code.indexOf(LANGS[i] + "-") === 0) return LANGS[i]; }
    return null;
  };
  return pick(q) || pick(navigator.language) || pick(navigator.userLanguage) || "en";
}

var deviceLang = detectLang();
var shown = {};          /* 每条商品是否已切到「译文」显示 */
LISTINGS.forEach(function (_, i) { shown[i] = false; });
var activeCat = 0;       /* 分类筛选：0=全部 */
var query = "";

function ui() { return UI[deviceLang] || UI.zh; }
function textOf(item, field) {
  /* 未翻译 → 显示原文语言；已翻译 → 显示设备语言 */
  var lang = shown[item._i] ? deviceLang : item.orig;
  return (item[field] && item[field][lang]) || item[field][item.orig] || "";
}

/* ================= 渲染 ================= */
function applyChrome() {
  var u = ui();
  document.getElementById("brand").textContent = u.brand;
  document.getElementById("tagline").textContent = u.tagline;
  document.getElementById("search").placeholder = u.search;
  document.getElementById("langLabel").textContent = u.langLabel;
  document.documentElement.lang = deviceLang;
  document.title = u.brand;
  // 语言下拉
  var sel = document.getElementById("langSel");
  sel.innerHTML = "";
  LANGS.forEach(function (l) {
    var o = document.createElement("option");
    o.value = l; o.textContent = (FLAG[l] || "") + " " + LANGNAME[l];
    if (l === deviceLang) o.selected = true;
    sel.appendChild(o);
  });
  // 分类
  var cats = document.getElementById("cats");
  cats.innerHTML = "";
  u.cats.forEach(function (c, i) {
    var el = document.createElement("div");
    el.className = "chip" + (i === activeCat ? " on" : "");
    el.textContent = c;
    el.onclick = function () { activeCat = i; applyChrome(); renderGrid(); };
    cats.appendChild(el);
  });
  // 底部导航
  var nav = document.getElementById("nav");
  nav.innerHTML = "";
  var icons = ["🏠", "＋", "💬", "🙂"];
  u.nav.forEach(function (n, i) {
    var el = document.createElement("div");
    el.className = "it" + (i === 0 ? " on" : "") + (i === 1 ? " pub" : "");
    el.innerHTML = "<span class='ic'>" + icons[i] + "</span>" + n;
    nav.appendChild(el);
  });
}

function renderGrid() {
  var u = ui();
  var grid = document.getElementById("grid");
  grid.innerHTML = "";
  LISTINGS.forEach(function (item, i) {
    if (activeCat !== 0 && item.cat !== activeCat) return;
    if (query) {
      var hay = (textOf(item, "t") + " " + textOf(item, "d") + " " + item.seller + " " + item.loc).toLowerCase();
      if (hay.indexOf(query) < 0) return;
    }
    item._i = i;
    var card = document.createElement("div");
    card.className = "card";
    var isLocal = (item.orig === deviceLang);
    var transHtml;
    if (isLocal) {
      transHtml = "<div class='trans locked'>🌐 " + esc(u.local) + "</div>";
    } else if (shown[i]) {
      transHtml = "<div class='trans done' data-tr='" + i + "'>✔ " + esc(u.orig) + "</div>" +
        "<div class='tnote'>" + esc(u.translatedTo) + " <b>" + (FLAG[deviceLang] || "") + " " + LANGNAME[deviceLang] + "</b> · " +
        esc(FLAG[item.orig] + " " + LANGNAME[item.orig]) + " → " + esc(FLAG[deviceLang] + " " + LANGNAME[deviceLang]) + "</div>";
    } else {
      transHtml = "<div class='trans' data-tr='" + i + "'>🌐 " + esc(u.trans) + "</div>" +
        "<div class='tnote'>" + esc(FLAG[item.orig] + " " + LANGNAME[item.orig]) + "</div>";
    }
    card.innerHTML =
      "<div class='thumb' style='background:" + item.bg + "'>" + item.e +
        "<span class='cond'>" + esc(u.cond) + " " + esc(item.cond) + "</span>" +
        "<span class='flag'>" + (FLAG[item.orig] || "") + "</span>" +
      "</div>" +
      "<div class='body'>" +
        "<div class='ttl'>" + esc(textOf(item, "t")) + "</div>" +
        "<div class='price'>" + esc(item.price) + "</div>" +
        "<div class='meta'><span class='seller'><span class='av'>" + item.av + "</span><span class='nm'>" + esc(item.seller) + " · " + esc(item.loc) + "</span></span>" +
          "<span class='want'>" + item.want + " " + esc(u.want) + "</span></div>" +
        transHtml +
      "</div>";
    card.addEventListener("click", function (ev) {
      var t = ev.target.closest ? ev.target.closest("[data-tr]") : null;
      if (t) { toggleTranslate(parseInt(t.getAttribute("data-tr"), 10)); return; }
      openDetail(i);
    });
    grid.appendChild(card);
  });
  if (!grid.children.length) {
    grid.innerHTML = "<div style='grid-column:1/3;text-align:center;color:#9aa0aa;padding:40px 0'>🔍 —</div>";
  }
}

function toggleTranslate(i) { shown[i] = !shown[i]; renderGrid(); }

/* ================= 详情弹层 ================= */
function openDetail(i) {
  var u = ui(), item = LISTINGS[i];
  item._i = i;
  var isLocal = (item.orig === deviceLang);
  var sheet = document.getElementById("sheet");
  var transBtn = isLocal
    ? "<div class='trans locked'>🌐 " + esc(u.local) + "</div>"
    : (shown[i]
        ? "<div class='trans done' data-tr='" + i + "'>✔ " + esc(u.orig) + "</div>"
        : "<div class='trans' data-tr='" + i + "'>🌐 " + esc(u.trans) + "</div>");
  var note = (!isLocal && shown[i])
    ? "<div class='tnote'>" + esc(u.translatedTo) + " <b>" + (FLAG[deviceLang] || "") + " " + LANGNAME[deviceLang] + "</b></div>" : "";
  sheet.innerHTML =
    "<div class='hero' style='background:" + item.bg + "'>" + item.e +
      "<button class='x' id='dx'>✕</button></div>" +
    "<div class='pad'>" +
      "<div class='dprice'>" + esc(item.price) + "</div>" +
      "<div class='dtitle' id='dtitle'>" + esc(textOf(item, "t")) + "</div>" +
      "<div class='dtags'><span>" + esc(u.cond) + " " + esc(item.cond) + "</span><span>" + esc(u.ship) + " · " + esc(item.ship) + "</span><span>" + item.want + " " + esc(u.want) + "</span></div>" +
      "<div style='margin-top:10px'>" + transBtn + note + "</div>" +
      "<div class='ddesc' id='ddesc'>" + esc(textOf(item, "d")) + "</div>" +
      "<div class='dsec'><h4>" + esc(u.seller) + "</h4>" +
        "<div class='sellerbox'><div class='bigav'>" + item.av + "</div>" +
          "<div class='info'>" + esc(item.seller) + "<div class='s2'>" + esc(u.region) + "：" + esc(item.loc) + "</div></div></div></div>" +
      "<div class='actions'>" +
        "<button class='btn chat' id='dchat'>💬 " + esc(u.chat) + "</button>" +
        "<button class='btn buy' id='dbuy'>🛒 " + esc(u.buy) + "</button>" +
      "</div>" +
    "</div>";
  document.getElementById("mask").classList.add("show");
  document.getElementById("dx").onclick = closeDetail;
  document.getElementById("dbuy").onclick = function () { order(i); };
  document.getElementById("dchat").onclick = function () { toast("💬", esc(item.seller)); };
  var tb = sheet.querySelector("[data-tr]");
  if (tb) tb.onclick = function () {
    toggleTranslate(i);
    // 刷新弹层里的标题/描述/按钮
    document.getElementById("dtitle").textContent = textOf(item, "t");
    document.getElementById("ddesc").textContent = textOf(item, "d");
    renderGrid(); openDetail(i);
  };
}
function closeDetail() { document.getElementById("mask").classList.remove("show"); }

function order(i) {
  closeDetail();
  toast("🎉", ui().orderOK + "（" + LISTINGS[i].price + "）");
}

/* ================= toast ================= */
var toastTimer = null;
function toast(big, msg) {
  var t = document.getElementById("toast");
  t.innerHTML = "<span class='big'>" + big + "</span>" + msg;
  t.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c];
  });
}

/* ================= 事件 ================= */
document.getElementById("langSel").addEventListener("change", function (e) {
  deviceLang = e.target.value;
  applyChrome(); renderGrid();
});
document.getElementById("search").addEventListener("input", function (e) {
  query = e.target.value.trim().toLowerCase(); renderGrid();
});
document.getElementById("mask").addEventListener("click", function (e) {
  if (e.target === document.getElementById("mask")) closeDetail();
});

/* ================= 启动 ================= */
applyChrome();
renderGrid();
</script>
</body>
</html>
